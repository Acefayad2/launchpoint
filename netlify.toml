[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/invoice/amg"
  to = "/invoice-amg.html"
  status = 200

[[redirects]]
  from = "/pay/amg"
  to = "/invoice-amg.html"
  status = 200

[[redirects]]
  from = "/invoice/LP-AMG-20261027-01"
  to = "/invoice-amg.html"
  status = 200

[[redirects]]
  from = "/invoice/:id"
  to = "/invoice-request.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin-setup.html"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/dashboard.html"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"

# Netlify also serves extensionless URLs through Pretty URLs.
[[headers]]
  for = "/admin-setup"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/dashboard"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
