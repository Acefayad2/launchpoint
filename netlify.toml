[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/invoice/amg"
  to = "/invoice-amg.html"
  status = 200

[[redirects]]
  from = "/pay/amg"
  to = "/invoice-amg.html"
  status = 200

[[redirects]]
  from = "/invoice/LP-AMG-20261027-01"
  to = "/invoice-amg.html"
  status = 200

[[redirects]]
  from = "/invoice/:id"
  to = "/invoice-request.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
